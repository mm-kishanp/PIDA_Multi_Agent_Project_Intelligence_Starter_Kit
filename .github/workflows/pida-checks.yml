# Optional PIDA consistency check. Fails when native skill copies drift from
# .agents/skills. Delete this file if your repository does not want it.
name: PIDA checks

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"
      - ".github/skills/**"
      - ".agent/skills/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".claude/agents/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check skill copies match .agents/skills
        run: python scripts/sync-skills.py --check
      # Present only in the PIDA kit itself, not in repositories PIDA is installed into.
      - name: Test installer and plugin manifests
        if: hashFiles('tests/test_pida_scripts.py') != ''
        run: python -m unittest discover -s tests -v
